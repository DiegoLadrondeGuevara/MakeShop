AWSTemplateFormatVersion: "2010-09-09"
Description: "MakeShop: API Gateway HTTPS, ALB interno y bases de datos privadas"

Parameters:
  InstanceName:
    Type: String
    Default: "MV-MakeShop"
    Description: "Prefijo de nombre para las instancias"

  AMI:
    Type: String
    Default: "ami-08d434e92c0cfa0c0"
    Description: "ID de AMI"

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: "vockey"
    Description: "KeyPair para acceso administrativo"

  InstanceType:
    Type: String
    Default: "t3.medium"
    AllowedValues:
      - "t2.micro"
      - "t3.micro"
      - "t3.small"
      - "t3.medium"
    Description: "Tipo de instancia para App Servers"

  DbInstanceType:
    Type: String
    Default: "t3.medium"
    AllowedValues:
      - "t3.micro"
      - "t3.small"
      - "t3.medium"
      - "t3.large"
    Description: "Tipo de instancia para DB Server"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC donde desplegar los recursos"

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet 1 para App Server, ALB interno y VPC Link"

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet 2 para App Server, ALB interno y VPC Link"




  FrontendRepoUrl:
    Type: String
    Default: "https://github.com/Lazheart/MakeShop"
    Description: "Repositorio Git para Amplify"

  FrontendBranchName:
    Type: String
    Default: "main"
    Description: "Branch del repositorio a desplegar en Amplify"

  FrontendAmplifyAppName:
    Type: String
    Default: "makeshop-frontend"
    Description: "Nombre de la app de Amplify"

  FrontendAmplifyAccessToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Token de GitHub para Amplify"

  DockerImageNamespace:
    Type: String
    Default: "lazheart"
    Description: "Namespace/usuario de Docker Hub"

  DockerImageTag:
    Type: String
    Default: "latest"
    Description: "Tag de las imágenes Docker del backend"

Conditions:
  HasFrontendAmplifyAccessToken: !Not [!Equals [!Ref FrontendAmplifyAccessToken, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Red y Security Groups
  # ---------------------------------------------------------------------------

  VpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "API Gateway VPC Link hacia ALB interno"
      VpcId: !Ref VpcId

  # Se conserva GroupDescription para actualizar el SG existente sin reemplazarlo.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB: permitir HTTP y puertos convencionales desde internet"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8004
          ToPort: 8004
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8005
          ToPort: 8005
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup

  # Se conserva GroupDescription para actualizar el SG existente sin reemplazarlo.
  AppServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "App Servers: HTTP de servicios convencionales solo desde ALB, SSH opcional"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8004
          ToPort: 8004
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 8005
          ToPort: 8005
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"

  # La MV de ingesta debe usarlo para acceder a las bases de datos.
  IngestServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Ingest Server: acceso a DB desde la MV de ingesta"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"

  # La descripción histórica se conserva; las reglas efectivas de DB son privadas.
  DbServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "DB Server: PostgreSQL/MySQL/Mongo accesibles publicamente (segun requerimiento)"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppServerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref IngestServerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 27017
          ToPort: 27017
          SourceSecurityGroupId: !Ref AppServerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 27017
          ToPort: 27017
          SourceSecurityGroupId: !Ref IngestServerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 3307
          ToPort: 3307
          SourceSecurityGroupId: !Ref AppServerSecurityGroup
        - IpProtocol: "tcp"
          FromPort: 3307
          ToPort: 3307
          SourceSecurityGroupId: !Ref IngestServerSecurityGroup

  # ---------------------------------------------------------------------------
  # Entrada pública: API Gateway HTTPS -> VPC Link -> ALB interno
  # ---------------------------------------------------------------------------

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "os-int-${AWS::StackName}"
      Scheme: "internal"
      Type: "application"
      IpAddressType: "ipv4"
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "openstore-http-api-${AWS::StackName}"
      ProtocolType: "HTTP"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        AllowHeaders:
          - "*"

  HttpApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub "openstore-vpc-link-${AWS::StackName}"
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroup
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: "HTTP_PROXY"
      IntegrationMethod: "ANY"
      IntegrationUri: !Ref HttpListener
      ConnectionType: "VPC_LINK"
      ConnectionId: !Ref HttpApiVpcLink
      PayloadFormatVersion: "1.0"

  HttpApiProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: "HTTP_PROXY"
      IntegrationMethod: "ANY"
      IntegrationUri: !Ref HttpListener
      ConnectionType: "VPC_LINK"
      ConnectionId: !Ref HttpApiVpcLink
      PayloadFormatVersion: "1.0"

  HttpApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${HttpApiProxyIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  # ---------------------------------------------------------------------------
  # Target groups y listeners. Se mantienen los puertos/servicios del main.
  # ---------------------------------------------------------------------------

  PrivateStoreTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "os-int-store-tg"
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 8004
      TargetType: "instance"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/health"
      Matcher:
        HttpCode: "200-399"
      Targets:
        - Id: !Ref AppServer1Private
          Port: 8004
        - Id: !Ref AppServer2Private
          Port: 8004

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateStoreTargetGroup

  StoreListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8004
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateStoreTargetGroup

  PrivateUserTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "os-int-user-tg"
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 8080
      TargetType: "instance"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/health"
      Matcher:
        HttpCode: "200-399"
      Targets:
        - Id: !Ref AppServer1Private
          Port: 8080
        - Id: !Ref AppServer2Private
          Port: 8080

  PrivateShopTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "os-int-shop-tg"
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 3000
      TargetType: "instance"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/health"
      Matcher:
        HttpCode: "200-399"
      Targets:
        - Id: !Ref AppServer1Private
          Port: 3000
        - Id: !Ref AppServer2Private
          Port: 3000

  PrivateProductTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "os-int-prod-tg"
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 8000
      TargetType: "instance"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/healthcheck"
      Matcher:
        HttpCode: "200-399"
      Targets:
        - Id: !Ref AppServer1Private
          Port: 8000
        - Id: !Ref AppServer2Private
          Port: 8000

  PrivateDataAnalystTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "os-int-data-tg"
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 8005
      TargetType: "instance"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/health"
      Matcher:
        HttpCode: "200-399"
      Targets:
        - Id: !Ref AppServer1Private
          Port: 8005
        - Id: !Ref AppServer2Private
          Port: 8005

  UserListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateUserTargetGroup

  ShopListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 3000
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateShopTargetGroup

  ProductListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8000
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateProductTargetGroup

  DataAnalystListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8005
      Protocol: "HTTP"
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref PrivateDataAnalystTargetGroup

  # ---------------------------------------------------------------------------
  # App Servers. Estos IDs fuerzan una recreación única al migrar desde el template legado.
  # ---------------------------------------------------------------------------

  AppServer1Private:
    Type: AWS::EC2::Instance
    DependsOn:
      - DbServer
      - DbServerSecurityGroup
    Properties:
      Tags:
        - Key: "Name"
          Value: !Sub "${InstanceName}-App-1"
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: "LabInstanceProfile"
      SecurityGroupIds:
        - !Ref AppServerSecurityGroup
      SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "30"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/user-data.log 2>&1
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin git
          systemctl enable --now docker
          usermod -aG docker ubuntu || true
          cd /home/ubuntu
          rm -rf MakeShop
          git clone "${FrontendRepoUrl}" MakeShop
          chown -R ubuntu:ubuntu MakeShop
          cd MakeShop/backend
          cat > .env <<EOF_ENV
          DOCKER_IMAGE_NAMESPACE=${DockerImageNamespace}
          DOCKER_IMAGE_TAG=${DockerImageTag}
          DB_HOST=${DbServer.PrivateIp}
          POSTGRES_DB=userdb
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=admin123
          DATABASE_URL=jdbc:postgresql://${DbServer.PrivateIp}:5432/userdb
          DB_USERNAME=admin
          DB_PASSWORD=admin123
          DB_NAME=userdb
          JPA_DDL_AUTO=update
          APP_BASE_URL=https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
          JWT_SECRET=$(printf '%s' '${AWS::StackId}' | base64 -w0)
          JWT_EXPIRATION=86400000
          MYSQL_ROOT_PASSWORD=admin123
          MYSQL_DATABASE=shopdb
          MYSQL_USER=admin
          MYSQL_PASSWORD=admin123
          SHOP_DB_USERNAME=admin
          SHOP_DB_PASSWORD=admin123
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=admin123
          MONGO_INITDB_DATABASE=productdb
          AWS_REGION=${AWS::Region}
          BUCKET_NAME=${ImagesBucket}
          ATHENA_DATABASE=openstore_catalog
          ATHENA_RESULTS_BUCKET=s3://openstore-ingest-${AWS::AccountId}/athena-results/
          ATHENA_WORKGROUP=openstore-workgroup
          DATA_ANALYST_SERVICE_URL=http://data-analyst-service:8005
          EOF_ENV
          for port in 5432 3307 27017; do
            ready=0
            for attempt in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/${DbServer.PrivateIp}/$port" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Database port $port is not ready"
              exit 1
            fi
          done
          docker compose pull
          docker compose up -d
          cd ..
          sudo rm -rf frontend
          sudo rm -rf database
          cd ..

  AppServer2Private:
    Type: AWS::EC2::Instance
    DependsOn:
      - DbServer
      - DbServerSecurityGroup
    Properties:
      Tags:
        - Key: "Name"
          Value: !Sub "${InstanceName}-App-2"
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: "LabInstanceProfile"
      SecurityGroupIds:
        - !Ref AppServerSecurityGroup
      SubnetId: !Ref PublicSubnet2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "30"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/user-data.log 2>&1
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin git
          systemctl enable --now docker
          usermod -aG docker ubuntu || true
          cd /home/ubuntu
          rm -rf MakeShop
          git clone "${FrontendRepoUrl}" MakeShop
          chown -R ubuntu:ubuntu MakeShop
          cd MakeShop/backend
          cat > .env <<EOF_ENV
          DOCKER_IMAGE_NAMESPACE=${DockerImageNamespace}
          DOCKER_IMAGE_TAG=${DockerImageTag}
          DB_HOST=${DbServer.PrivateIp}
          POSTGRES_DB=userdb
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=admin123
          DATABASE_URL=jdbc:postgresql://${DbServer.PrivateIp}:5432/userdb
          DB_USERNAME=admin
          DB_PASSWORD=admin123
          DB_NAME=userdb
          JPA_DDL_AUTO=update
          APP_BASE_URL=https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
          JWT_SECRET=$(printf '%s' '${AWS::StackId}' | base64 -w0)
          JWT_EXPIRATION=86400000
          MYSQL_ROOT_PASSWORD=admin123
          MYSQL_DATABASE=shopdb
          MYSQL_USER=admin
          MYSQL_PASSWORD=admin123
          SHOP_DB_USERNAME=admin
          SHOP_DB_PASSWORD=admin123
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=admin123
          MONGO_INITDB_DATABASE=productdb
          AWS_REGION=${AWS::Region}
          BUCKET_NAME=${ImagesBucket}
          ATHENA_DATABASE=openstore_catalog
          ATHENA_RESULTS_BUCKET=s3://openstore-ingest-${AWS::AccountId}/athena-results/
          ATHENA_WORKGROUP=openstore-workgroup
          DATA_ANALYST_SERVICE_URL=http://data-analyst-service:8005
          EOF_ENV
          for port in 5432 3307 27017; do
            ready=0
            for attempt in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/${DbServer.PrivateIp}/$port" 2>/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Database port $port is not ready"
              exit 1
            fi
          done
          docker compose pull
          docker compose up -d
          cd ..
          sudo rm -rf frontend
          sudo rm -rf database
          cd ..

  # ---------------------------------------------------------------------------
  # DB Server. Se conserva el host actual y se privatizan los puertos de base de datos con SG.
  # ---------------------------------------------------------------------------

  DbServer:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: "Name"
          Value: !Sub "${InstanceName}-DB"
      ImageId: !Ref AMI
      InstanceType: !Ref DbInstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: "LabInstanceProfile"
      SecurityGroupIds:
        - !Ref DbServerSecurityGroup
      SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "30"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/user-data.log 2>&1
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin git
          systemctl enable --now docker
          usermod -aG docker ubuntu || true
          cd /home/ubuntu
          rm -rf MakeShop
          git clone "${FrontendRepoUrl}" MakeShop
          chown -R ubuntu:ubuntu MakeShop
          cd MakeShop
          sudo rm -rf frontend
          sudo rm -rf backend
          cd database
          cat > .env <<EOF
          POSTGRES_DB=userdb
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=admin123
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=admin123
          MONGO_INITDB_DATABASE=productdb
          MYSQL_ROOT_PASSWORD=admin123
          MYSQL_DATABASE=shopdb
          MYSQL_USER=admin
          MYSQL_PASSWORD=admin123
          EOF
          docker compose up -d
          cd ..

  # Se conserva la EIP existente del host para administración. Los puertos DB no aceptan tráfico público.
  DbServerElasticAddress:
    Type: AWS::EC2::EIP
    DependsOn: DbServer
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        - Key: "Name"
          Value: !Sub "${InstanceName}-DB-EIP"

  DbServerElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: DbServer
    Properties:
      AllocationId: !GetAtt DbServerElasticAddress.AllocationId
      InstanceId: !Ref DbServer

  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "makeshop-products-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  ProfilePictureBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "makeshop-profile-pictures-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  FrontendAmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref FrontendAmplifyAppName
      Repository: !Ref FrontendRepoUrl
      AccessToken: !If [HasFrontendAmplifyAccessToken, !Ref FrontendAmplifyAccessToken, !Ref "AWS::NoValue"]
      BuildSpec: |
        version: 1
        applications:
          - appRoot: frontend
            frontend:
              phases:
                preBuild:
                  commands:
                    - npm install -g pnpm
                    - pnpm install --frozen-lockfile
                build:
                  commands:
                    - pnpm run build
              artifacts:
                baseDirectory: dist
                files:
                  - '**/*'
              cache:
                paths:
                  - node_modules/**/*
      EnvironmentVariables:
        - Name: LOAD_BALANCER_API
          Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
        - Name: VITE_LOAD_BALANCER_API
          Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: "frontend"
      CustomRules:
        - Source: "/<*>"
          Target: "/index.html"
          Status: "404-200"

  FrontendAmplifyBranch:
    Type: AWS::Amplify::Branch
    DependsOn: ApplicationLoadBalancer
    Properties:
      AppId: !GetAtt FrontendAmplifyApp.AppId
      BranchName: !Ref FrontendBranchName
      EnableAutoBuild: true
      Stage: PRODUCTION
      EnvironmentVariables:
        - Name: LOAD_BALANCER_API
          Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
        - Name: VITE_LOAD_BALANCER_API
          Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: "frontend"

Outputs:
  LoadBalancerDNS:
    Description: "DNS interno del Application Load Balancer"
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AppServer1PublicIP:
    Description: "IP pública del App Server 1 para administración"
    Value: !GetAtt AppServer1Private.PublicIp

  AppServer2PublicIP:
    Description: "IP pública del App Server 2 para administración"
    Value: !GetAtt AppServer2Private.PublicIp

  DbServerPrivateIP:
    Description: "IP privada para conexiones de backend e ingesta a las bases de datos"
    Value: !GetAtt DbServer.PrivateIp

  DbServerPublicIP:
    Description: "Elastic IP administrativa del host DB"
    Value: !Ref DbServerElasticAddress

  DbServerElasticIP:
    Description: "Elastic IP administrativa del host DB; no usar para conexiones de base de datos"
    Value: !Ref DbServerElasticAddress

  IngestServerSecurityGroupId:
    Description: "Security Group que debe usar la MV de ingesta para acceder a PostgreSQL/MySQL/Mongo"
    Value: !Ref IngestServerSecurityGroup

  ImagesBucketName:
    Description: "Nombre del bucket S3"
    Value: !Ref ImagesBucket

  FrontendAmplifyAppId:
    Description: "AppId de Amplify para frontend"
    Value: !GetAtt FrontendAmplifyApp.AppId

  FrontendAmplifyDefaultDomain:
    Description: "Dominio base de Amplify"
    Value: !GetAtt FrontendAmplifyApp.DefaultDomain

  FrontendAmplifyURL:
    Description: "URL pública del frontend en Amplify"
    Value: !Sub "https://${FrontendBranchName}.${FrontendAmplifyApp.DefaultDomain}"

  HttpApiEndpoint:
    Description: "Endpoint público HTTPS del backend mediante API Gateway"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
