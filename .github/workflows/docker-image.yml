name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  user-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'backend/user-service/**'

      - name: Setup Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/user-service
          file: ./backend/user-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}

